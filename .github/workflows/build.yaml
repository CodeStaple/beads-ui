name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Image build and publish belong to Ankra's generated setup workflow, which
# pushes to the organisation registry with the robot Ankra provisions per
# application. This workflow only guards code quality.

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: azure/setup-helm@v4
      - name: Lint the chart
        run: |
          helm lint helm/beads-linear \
            --set github.token=dummy \
            --set basicAuth.users=dummy
