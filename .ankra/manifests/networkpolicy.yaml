apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beads-ui
  labels:
    app.kubernetes.io/name: beads-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: beads-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - ports:
        - port: 3000
          protocol: TCP
