{{- if not .Values.github.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beads-linear.secretName" . }}
  labels:
    {{- include "beads-linear.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "github.token or github.existingSecret is required" .Values.github.token | quote }}
{{- end }}
