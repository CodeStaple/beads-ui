{{- if not .Values.session.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beads-linear.secretName" . }}
  labels:
    {{- include "beads-linear.labels" . | nindent 4 }}
type: Opaque
stringData:
  sessionSecret: {{ required "session.secret or session.existingSecret is required" .Values.session.secret | quote }}
{{- end }}
