apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beads-linear.fullname" . }}
  labels:
    {{- include "beads-linear.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "beads-linear.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beads-linear.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- if not .Values.sourceBuild.enabled }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.sourceBuild.enabled }}
      initContainers:
        - name: build
          image: {{ .Values.sourceBuild.builderImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cd /workspace
              echo "fetching {{ .Values.sourceBuild.repo }}@{{ .Values.sourceBuild.ref }}"
              wget -qO src.tar.gz \
                "https://codeload.github.com/{{ .Values.sourceBuild.repo }}/tar.gz/{{ .Values.sourceBuild.ref }}"
              tar xzf src.tar.gz --strip-components=1
              rm src.tar.gz
              npm ci --no-audit --no-fund
              npm run build
              # Assemble the standalone bundle the runtime container serves.
              cp -r .next/standalone/. /app/
              mkdir -p /app/.next
              cp -r .next/static /app/.next/static
              if [ -d public ]; then cp -r public /app/public; fi
              echo "build complete: $(du -sh /app | cut -f1)"
          env:
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: npm_config_cache
              value: /workspace/.npm
          resources:
            {{- toYaml .Values.sourceBuild.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
            - name: workspace
              mountPath: /workspace
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          {{- if .Values.sourceBuild.enabled }}
          image: {{ .Values.sourceBuild.builderImage | quote }}
          workingDir: /app
          command: ["node", "server.js"]
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: GITHUB_OWNER
              value: {{ .Values.github.owner | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.github.repo | quote }}
            - name: GITHUB_BRANCH
              value: {{ .Values.github.branch | quote }}
            - name: GITHUB_PATH
              value: {{ .Values.github.path | quote }}
            - name: BEADS_PREFIX
              value: {{ .Values.beads.prefix | quote }}
            - name: BEADS_ACTOR
              value: {{ .Values.beads.actor | quote }}
            - name: POLL_INTERVAL_MS
              value: {{ .Values.pollIntervalMs | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "beads-linear.secretName" . }}
                  key: token
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ not .Values.sourceBuild.enabled }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.sourceBuild.enabled }}
            - name: app
              mountPath: /app
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.sourceBuild.enabled }}
        - name: app
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
