{{- if and .Values.ingress.enabled .Values.basicAuth.enabled }}
{{- if not .Values.basicAuth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beads-linear.basicAuthSecretName" . }}
  labels:
    {{- include "beads-linear.labels" . | nindent 4 }}
type: Opaque
stringData:
  users: {{ required "basicAuth.users or basicAuth.existingSecret is required when basicAuth is enabled" .Values.basicAuth.users | quote }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "beads-linear.fullname" . }}-auth
  labels:
    {{- include "beads-linear.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ include "beads-linear.basicAuthSecretName" . }}
    realm: beads
    removeHeader: true
{{- end }}
