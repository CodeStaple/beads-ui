replicaCount: 2

# Interim lane: build from public source at pod start instead of pulling a
# published image. Needed only while the image pipeline is blocked - Ankra
# Pipelines needs the platform_builds capability enabled for the org, and the
# Applications lane needs GitHub App permissions on the CodeStaple install.
# Turn this off and set image.tag as soon as a real image exists.
sourceBuild:
  enabled: false
  repo: CodeStaple/beads-ui
  ref: main
  builderImage: node:22-alpine
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 3Gi

# Matches the lane the rest of this cluster already uses:
#   artifact.smartoptics.dev/<app>-images/<app>:sha-<short>
image:
  repository: artifact.smartoptics.dev/beads-images/beads-linear
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-registry

# GitHub is the database. The token is supplied as a Secret, never baked into
# the image and never committed.
github:
  owner: smartoptics-dwdm
  repo: beads
  branch: beads-db
  path: .beads/issues.jsonl
  # Set either an existing secret holding key `token`, or an inline value
  # (inline is intended for --set-file / --set-env at deploy time only).
  existingSecret: ""
  token: ""

beads:
  prefix: so
  actor: beads-linear

pollIntervalMs: 5000

ingress:
  enabled: true
  className: traefik
  host: beads.smartoptics.dev
  # Ankra custom-dns watches this annotation and publishes the record.
  dnsAnnotation: true
  tls:
    enabled: true
    issuer: letsencrypt-prod
    secretName: beads-linear-tls

# The app has no login of its own, so the edge enforces one. Without this the
# write API would be open to anyone who reaches the host.
basicAuth:
  enabled: true
  # htpasswd lines (bcrypt). Supplied at deploy time; never committed.
  existingSecret: ""
  users: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

service:
  port: 80
  targetPort: 3000

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
