# One replica by design: accounts and organisation settings live on a single
# ReadWriteOnce volume, and the tracker itself is in GitHub rather than here.
replicaCount: 1

image:
  repository: ghcr.io/codestaple/beads-ui
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Signs the session cookie. Rotating it signs everyone out, which is the
# intended way to revoke every session at once.
session:
  existingSecret: ""
  secret: ""

# Holds accounts, passkeys, and each organisation's GitHub connection.
persistence:
  enabled: true
  existingClaim: ""
  size: 1Gi
  storageClass: ""

pollIntervalMs: 5000

ingress:
  enabled: true
  className: traefik
  host: beads.example.com
  # Ankra custom-dns watches this annotation and publishes the record.
  dnsAnnotation: true
  tls:
    enabled: true
    issuer: letsencrypt-prod
    secretName: beads-linear-tls

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

service:
  port: 80
  targetPort: 3000

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
